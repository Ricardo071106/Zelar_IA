services:
  - type: web
    name: zelar-ia
    runtime: docker
    plan: standard
    branch: main
    disk:
      name: zelar-data
      mountPath: /opt/render/project/src/.zelar-data
      sizeGB: 5
    envVars:
      - key: PANEL_TOKEN_SECRET
        generateValue: true
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/google-chrome-stable
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_AUTH_DIR
        value: /opt/render/project/src/.zelar-data/whatsapp-auth
      - key: OLLAMA_MODELS
        value: /opt/render/project/src/.zelar-data/ollama-models
      - key: LLM_BASE_URL
        value: http://127.0.0.1:11434/v1
      - key: LLM_MODEL
        value: qwen2.5:1.5b-instruct
      - key: LLM_NUM_CTX
        value: "2048"
      - key: LLM_NUM_PREDICT
        value: "512"
      - key: OLLAMA_NUM_PARALLEL
        value: "1"
      - key: OLLAMA_MAX_LOADED_MODELS
        value: "1"
      - key: LLM_API_KEY
        value: ollama
      - key: OLLAMA_AUTO_PULL
        value: "true"
      - key: OLLAMA_HOST
        value: 127.0.0.1:11434
  - type: cron
    name: zelar-ia-midnight-restart
    runtime: node
    schedule: "0 3 * * *"
    buildCommand: "true"
    startCommand: >
      node -e "const url = process.env.RESTART_WEBHOOK_URL; const token = process.env.RESTART_WEBHOOK_TOKEN; if (!url || !token) { console.error('RESTART_WEBHOOK_URL/RESTART_WEBHOOK_TOKEN ausentes'); process.exit(1); } fetch(url, { method: 'POST', headers: { Authorization: 'Bearer ' + token } }).then(async (res) => { const body = await res.text(); console.log(body); process.exit(res.ok ? 0 : 1); }).catch((error) => { console.error(error); process.exit(1); });"
    envVars:
      - key: RESTART_WEBHOOK_URL
        sync: false
      - key: RESTART_WEBHOOK_TOKEN
        sync: false
